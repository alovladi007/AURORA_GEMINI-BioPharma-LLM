version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pharma-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharma-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pharma-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pharma-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pharma-backend-prod
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
      INIT_DB: "false"
      CREATE_SAMPLE_DATA: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/ml/models/artifacts:/app/ml/models/artifacts:ro
      - storage_data_prod:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pharma-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pharma-celery-worker-prod
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      - redis
      - db
    volumes:
      - ./backend/ml/models/artifacts:/app/ml/models/artifacts:ro
      - storage_data_prod:/app/storage
    networks:
      - pharma-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pharma-celery-beat-prod
    restart: always
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      - redis
      - db
    networks:
      - pharma-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: pharma-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pharma-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pharma-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pharma-network

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  storage_data_prod:
    driver: local
  nginx_logs:
    driver: local

networks:
  pharma-network:
    driver: bridge
